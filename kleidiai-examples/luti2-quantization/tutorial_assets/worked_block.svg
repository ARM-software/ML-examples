<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Worked 2-bit LUT quantisation example</title>
  <desc id="desc">A shared four-entry LUT is multiplied by a weight scale of 1.43 to produce four representable values. Eight floating-point weights map to 2-bit indices and reconstructed values.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #172033; }
      .heading { font: 700 18px sans-serif; fill: #172033; }
      .body { font: 17px sans-serif; fill: #334155; }
      .mono { font: 17px monospace; fill: #172033; }
      .small { font: 15px sans-serif; fill: #526176; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#arrow2); }
      .cell { stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text class="title" x="600" y="38" text-anchor="middle">One block: from floating-point weights to stored 2-bit data</text>

  <rect class="box" x="40" y="75" width="270" height="125" fill="#eaf2f8"/>
  <text class="heading" x="65" y="108">Shared LUT shape</text>
  <text class="mono" x="65" y="145">{-1, -0.3, +0.3, +1}</text>
  <text class="small" x="65" y="178">Indices 0, 1, 2, and 3</text>

  <line class="arrow" x1="320" y1="137" x2="390" y2="137"/>
  <text class="heading" x="355" y="115" text-anchor="middle">×</text>

  <rect class="box" x="400" y="75" width="175" height="125" fill="#fdf2e9"/>
  <text class="heading" x="425" y="108">Block scale</text>
  <text class="mono" x="425" y="150">s = 1.43</text>
  <text class="small" x="425" y="178">fitted for this block</text>

  <line class="arrow" x1="585" y1="137" x2="655" y2="137"/>

  <rect class="box" x="665" y="75" width="495" height="125" fill="#eaf7ee"/>
  <text class="heading" x="690" y="108">Representable values for this block</text>
  <text class="mono" x="690" y="145">index:    0       1       2       3</text>
  <text class="mono" x="690" y="178">value: -1.430  -0.429  +0.429  +1.430</text>

  <text class="heading" x="40" y="245">Map every weight to its nearest representable value</text>
  <rect class="cell" x="40" y="270" width="135" height="42" fill="#f8fafc"/><text class="mono" x="55" y="297">weight</text>
  <rect class="cell" x="175" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="190" y="297">0.31</text>
  <rect class="cell" x="295" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="310" y="297">-1.22</text>
  <rect class="cell" x="415" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="430" y="297">0.07</text>
  <rect class="cell" x="535" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="550" y="297">0.89</text>
  <rect class="cell" x="655" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="670" y="297">-0.44</text>
  <rect class="cell" x="775" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="790" y="297">1.65</text>
  <rect class="cell" x="895" y="270" width="120" height="42" fill="#f8fafc"/><text class="mono" x="910" y="297">-0.10</text>
  <rect class="cell" x="1015" y="270" width="145" height="42" fill="#f8fafc"/><text class="mono" x="1030" y="297">-0.73</text>

  <rect class="cell" x="40" y="312" width="135" height="42" fill="#f4ecf7"/><text class="mono" x="55" y="339">index</text>
  <rect class="cell" x="175" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="225" y="339">2</text>
  <rect class="cell" x="295" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="345" y="339">0</text>
  <rect class="cell" x="415" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="465" y="339">2</text>
  <rect class="cell" x="535" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="585" y="339">2</text>
  <rect class="cell" x="655" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="705" y="339">1</text>
  <rect class="cell" x="775" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="825" y="339">3</text>
  <rect class="cell" x="895" y="312" width="120" height="42" fill="#f4ecf7"/><text class="mono" x="945" y="339">1</text>
  <rect class="cell" x="1015" y="312" width="145" height="42" fill="#f4ecf7"/><text class="mono" x="1075" y="339">1</text>

  <rect class="cell" x="40" y="354" width="135" height="42" fill="#eaf7ee"/><text class="small" x="50" y="381">reconstructed</text>
  <rect class="cell" x="175" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="190" y="381">0.429</text>
  <rect class="cell" x="295" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="310" y="381">-1.430</text>
  <rect class="cell" x="415" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="430" y="381">0.429</text>
  <rect class="cell" x="535" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="550" y="381">0.429</text>
  <rect class="cell" x="655" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="670" y="381">-0.429</text>
  <rect class="cell" x="775" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="790" y="381">1.430</text>
  <rect class="cell" x="895" y="354" width="120" height="42" fill="#eaf7ee"/><text class="mono" x="910" y="381">-0.429</text>
  <rect class="cell" x="1015" y="354" width="145" height="42" fill="#eaf7ee"/><text class="mono" x="1030" y="381">-0.429</text>

  <text class="body" x="40" y="440">Stored for this illustrative block: indices [2, 0, 2, 2, 1, 3, 1, 1] and scale 1.43. The shared LUT is stored once for the tensor.</text>
</svg>
