<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title desc">
  <title id="title">From floating-point weights to a LUTI2 experiment</title>
  <desc id="desc">lut2quant analyses floating-point weights and emits a four-entry int8 table, packed 2-bit indices, and weight scales. A LUTI2 kernel uses the table and indices, while the integration handles scaling and layout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 19px sans-serif; fill: #172033; }
      .body { font: 15px sans-serif; fill: #334155; }
      .small { font: 13px sans-serif; fill: #526176; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="270" fill="#ffffff"/>

  <rect class="box" x="25" y="65" width="205" height="125" fill="#eaf2f8"/>
  <text class="heading" x="127.5" y="105" text-anchor="middle">Floating-point tensor</text>
  <text class="body" x="127.5" y="137" text-anchor="middle">Weights to quantise</text>
  <text class="small" x="127.5" y="163" text-anchor="middle">NumPy, CSV, or text</text>

  <line class="arrow" x1="240" y1="127" x2="285" y2="127"/>

  <rect class="box" x="295" y="65" width="205" height="125" fill="#eaf7ee"/>
  <text class="heading" x="397.5" y="105" text-anchor="middle">lut2quant</text>
  <text class="body" x="397.5" y="137" text-anchor="middle">Compare candidate LUTs</text>
  <text class="small" x="397.5" y="163" text-anchor="middle">Keep the lowest-MSE choice</text>

  <line class="arrow" x1="510" y1="127" x2="555" y2="127"/>

  <rect class="box" x="565" y="20" width="245" height="66" fill="#f4ecf7"/>
  <text class="heading" x="687.5" y="48" text-anchor="middle">Four-entry int8 LUT</text>
  <text class="small" x="687.5" y="71" text-anchor="middle">Loaded into ZT0</text>
  <rect class="box" x="565" y="102" width="245" height="66" fill="#dbeaf4"/>
  <text class="heading" x="687.5" y="130" text-anchor="middle">Packed 2-bit indices</text>
  <text class="small" x="687.5" y="153" text-anchor="middle">Select the table entries</text>
  <rect class="box" x="565" y="184" width="245" height="66" fill="#fdf2e9"/>
  <text class="heading" x="687.5" y="212" text-anchor="middle">Weight scales</text>
  <text class="small" x="687.5" y="235" text-anchor="middle">One FP32 scale per channel</text>

  <line class="arrow" x1="820" y1="53" x2="865" y2="99"/>
  <line class="arrow" x1="820" y1="135" x2="865" y2="127"/>
  <line class="arrow" x1="820" y1="217" x2="865" y2="155"/>

  <rect class="box" x="875" y="65" width="200" height="125" fill="#f8fafc"/>
  <text class="heading" x="975" y="105" text-anchor="middle">LUTI2 experiment</text>
  <text class="body" x="975" y="137" text-anchor="middle">Kernel + packer</text>
  <text class="small" x="975" y="163" text-anchor="middle">Validate quality and speed</text>
</svg>
