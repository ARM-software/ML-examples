[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lut2quant"
version = "0.1.0"
description = "Select and export accurate 2-bit lookup-table quantizers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
lut2quant = "lut2quant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lut2quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["src"]
